name: Prevent Render Sleep

on:
  schedule:
    # Runs every 14 minutes to prevent Render's 15-minute sleep threshold
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        # REPLACE THIS URL WITH YOUR ACTUAL RENDER BACKEND URL
        run: curl -s https://your-backend-app.onrender.com > /dev/null
        
